[project]
name = "portfolia-api"
version = "0.0.0"
description = "Portfolia investment-portfolio tracker API"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.4",
    "psycopg2==2.9.13",
    "alembic==1.20.0",
    "redis==8.1.0",
    "polars==2.0.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "yfinance==1.7.0",
    "pyarrow==26.0.0",
    "httpx==0.28.1",
    "PyJWT==2.15.1",
    "bcrypt==5.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "email-validator==2.3.0",
    "python-dateutil==2.9.0.post0",
    "pyxirr==0.10.8",
    "reportlab==5.0.1",
    "pypdf==6.21.2",
    "pytr==0.4.10",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "fakeredis==2.40.0",
    "ta==0.11.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pandas", "numpy", "pytz", "dateutil", "dateutil.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
# py312 on purpose: with py314 the formatter drops the parentheses in
# `except (A, B):` (PEP 758), which reads like Python 2 syntax.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length is enforced by `ruff format`
    "E712",  # `== True` is required inside SQLAlchemy filter expressions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]  # package re-exports

[tool.ruff.lint.isort]
known-first-party = ["app", "api", "core", "modules", "utils", "config", "main", "health_check", "scripts", "tests", "workers"]
