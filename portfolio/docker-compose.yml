name: portfolio

# Live project file the current containers were started from, together with
# docker-compose.prod.yml. Bare `docker compose` in this directory now prefers
# compose.yaml (production images). Dev side-by-side is compose.dev.yaml.
# Shared Jetson host: cap memory, rotate logs, publish only the UI.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ./js
    volumes:
      - ./js/src:/app/src
      # Dev server config must be live; otherwise a stale image has no /api proxy → 404 on /api/...
      - ./js/vite.config.js:/app/vite.config.js:ro
    env_file:
      - ./js/.env.docker
    environment:
      - DOCKER_API_URL=http://api:8000
    ports:
      - "${PORTFOLIO_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - portfolio_network
      - homepage_proxy-network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ./python/app
      dockerfile: Dockerfile
    # Loopback only: the UI reaches the API through its /api proxy.
    ports:
      - "127.0.0.1:${PORTFOLIO_API_PORT:-8000}:8000"
    env_file:
      - ./python/app/.env.docker
    environment:
      - ARROW_DEFAULT_MEMORY_POOL=system
      - POLARS_FMT_MAX_ROWS=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Development: Mount source code for live reload
      - ./python/app/utils:/app/utils:delegated
      - ./python/app/api:/app/api:delegated
      - ./python/app/alembic:/app/alembic:delegated
      - ./python/app/alembic.ini:/app/alembic.ini:delegated
      - ./python/app/core:/app/core:delegated
      - ./python/app/config.py:/app/config.py:delegated
      - ./python/app/main.py:/app/main.py:delegated
      - ./python/app/start_api.py:/app/start_api.py:delegated
      - ./python/app/start_api.sh:/app/start_api.sh:delegated
      - ./python/app/requirements.txt:/app/requirements.txt:delegated
      - ./python/app/health_check.py:/app/health_check.py:delegated
      - ./python/app/scripts:/app/scripts:delegated
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background jobs (workers/run.py): watchlist prices and alerts. Same image as api.
  worker:
    build:
      context: ./python/app
      dockerfile: Dockerfile
    command: ["python", "-m", "workers.run"]
    env_file:
      - ./python/app/.env.docker
    depends_on:
      # api runs the migrations on start
      api:
        condition: service_healthy
    volumes:
      - ./python/app/core:/app/core:delegated
      - ./python/app/workers:/app/workers:delegated
      - ./python/app/config.py:/app/config.py:delegated
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384m
    healthcheck:
      # healthy while the heartbeat is younger than two intervals (+2 min slack)
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; i=int(os.environ.get('WORKER_INTERVAL_SECONDS','900')); sys.exit(time.time()-os.path.getmtime('/tmp/worker-heartbeat') > 2*i+120)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  postgres:
    build:
      context: ./python/app
      dockerfile: Dockerfile.postgres
    env_file:
      - ./python/app/.env.docker
    # No host port: only reachable on portfolio_network (use `docker compose exec postgres psql`).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    build:
      context: ./python/app
      dockerfile: Dockerfile.redis
    env_file:
      - ./python/app/.env.docker
    volumes:
      - redis_data:/data
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# Named volumes live under the Docker data-root (/mnt/samsung_ufs/docker_data on the Jetson).
volumes:
  postgres_data:
  redis_data:

networks:
  portfolio_network:
    driver: bridge
  homepage_proxy-network:
    external: true
