name: portfolio-dev

# Dev stack: build, bind mounts, reload, Vite. Project and ports are separate
# from production (`compose.yaml`, project `portfolio` on 3000/8000).
#   docker compose -f compose.dev.yaml up -d --wait
# UI http://localhost:3200  API http://127.0.0.1:8200/docs

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ./js
    volumes:
      - ./js/src:/app/src
      # Dev server config must be live; otherwise a stale image has no /api proxy → 404 on /api/...
      - ./js/vite.config.js:/app/vite.config.js:ro
    env_file:
      - ./js/.env.docker
    environment:
      - DOCKER_API_URL=http://api:8000
    ports:
      - "${PORTFOLIO_UI_PORT:-3200}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - portfolio_network
      - homepage_proxy-network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ./python/app
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORTFOLIO_API_PORT:-8200}:8000"
    env_file:
      - ./python/app/.env.docker
    environment:
      - ARROW_DEFAULT_MEMORY_POOL=system
      - POLARS_FMT_MAX_ROWS=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./python/app/utils:/app/utils:delegated
      - ./python/app/api:/app/api:delegated
      - ./python/app/alembic:/app/alembic:delegated
      - ./python/app/alembic.ini:/app/alembic.ini:delegated
      - ./python/app/core:/app/core:delegated
      - ./python/app/config.py:/app/config.py:delegated
      - ./python/app/main.py:/app/main.py:delegated
      - ./python/app/start_api.py:/app/start_api.py:delegated
      - ./python/app/start_api.sh:/app/start_api.sh:delegated
      - ./python/app/health_check.py:/app/health_check.py:delegated
      - ./python/app/scripts:/app/scripts:delegated
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./python/app
      dockerfile: Dockerfile
    command: ["python", "-m", "workers.run"]
    env_file:
      - ./python/app/.env.docker
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./python/app/core:/app/core:delegated
      - ./python/app/workers:/app/workers:delegated
      - ./python/app/config.py:/app/config.py:delegated
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; i=int(os.environ.get('WORKER_INTERVAL_SECONDS','900')); sys.exit(time.time()-os.path.getmtime('/tmp/worker-heartbeat') > 2*i+120)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  postgres:
    build:
      context: ./python/app
      dockerfile: Dockerfile.postgres
    env_file:
      - ./python/app/.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    build:
      context: ./python/app
      dockerfile: Dockerfile.redis
    env_file:
      - ./python/app/.env.docker
    volumes:
      - redis_data:/data
    networks:
      - portfolio_network
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:

networks:
  portfolio_network:
    driver: bridge
  homepage_proxy-network:
    external: true
