name: Release

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: publish arm64 images
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Image tags
        id: tags
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$HEAD_SHA"
            kind=edge
            version=
          else
            sha="$GITHUB_SHA"
            kind=version
            version="${GITHUB_REF_NAME#v}"
          fi
          write_tags() {
            name=$1
            delimiter=$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
            echo "${name}<<${delimiter}" >> "$GITHUB_OUTPUT"
            portfolio/scripts/release-tags.sh "$name" "$kind" "$sha" "$version" >> "$GITHUB_OUTPUT"
            echo "${delimiter}" >> "$GITHUB_OUTPUT"
          }
          write_tags api
          write_tags web

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build images for the scan
        run: |
          docker build -q -f portfolio/python/app/Dockerfile.prod -t portfolia-api:scan portfolio/python/app
          docker build -q -f portfolio/js/Dockerfile.prod -t portfolia-web:scan portfolio/js

      - name: Trivy (fails on a fixable critical CVE)
        run: |
          for image in portfolia-api:scan portfolia-web:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.1 image --scanners vuln --severity CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "$image"
          done

      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: portfolio/python/app
          file: portfolio/python/app/Dockerfile.prod
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=portfolia-api
          cache-to: type=gha,scope=portfolia-api,mode=max
          tags: ${{ steps.tags.outputs.api }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: portfolio/js
          file: portfolio/js/Dockerfile.prod
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=portfolia-web
          cache-to: type=gha,scope=portfolia-web,mode=max
          tags: ${{ steps.tags.outputs.web }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
