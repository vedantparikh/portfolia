services:
  api:
    image: portfolia-api:prod
    build: !reset null
    volumes: !reset []
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')",
        ]
  worker:
    image: portfolia-api:prod
    build: !reset null
    volumes: !reset []
    command: ["python", "-m", "workers.run"]
  app:
    image: portfolia-web:prod
    build: !reset null
    volumes: !reset []
    ports: !override
      - "${PORTFOLIO_UI_PORT:-3000}:8080"
    healthcheck:
      disable: true
